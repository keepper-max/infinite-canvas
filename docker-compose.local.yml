services:
  web:
    image: infinite-canvas-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      model-proxy:
        condition: service_healthy

  api:
    image: infinite-canvas-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      API_PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jingjie}
      COOKIE_SECURE: "false"
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  model-proxy:
    image: infinite-canvas-model-proxy:local
    build:
      context: .
      dockerfile: Dockerfile
      target: model-proxy
    environment:
      PORT: "3001"
      TOKEN360_API_KEY: ${TOKEN360_API_KEY:-}
      TOKEN360_UPSTREAM: ${TOKEN360_UPSTREAM:-https://api.token360.ai}
      TOKEN360_CATALOG_URL: ${TOKEN360_CATALOG_URL:-https://api.token360.ai/public/models?size=200&current=1}

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jingjie}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
