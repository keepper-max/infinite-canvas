services:
  web:
    image: infinite-canvas-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      model-proxy:
        condition: service_healthy

  api:
    image: infinite-canvas-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      API_PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jingjie}
      COOKIE_SECURE: "false"
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
      PAYMENT_ENABLED: ${PAYMENT_ENABLED:-false}
      PAYMENT_COMPLIANCE_APPROVED: ${PAYMENT_COMPLIANCE_APPROVED:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_APP_PRIVATE_KEY_PEM: ${ALIPAY_APP_PRIVATE_KEY_PEM:-}
      ALIPAY_PUBLIC_KEY_PEM: ${ALIPAY_PUBLIC_KEY_PEM:-}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      ALIPAY_ORDER_TIMEOUT_MINUTES: ${ALIPAY_ORDER_TIMEOUT_MINUTES:-}
    depends_on:
      db:
        condition: service_healthy

  model-proxy:
    image: infinite-canvas-model-proxy:local
    build:
      context: .
      dockerfile: Dockerfile
      target: model-proxy
    environment:
      PORT: "3001"
      TOKEN360_API_KEY: ${TOKEN360_API_KEY:-}
      TOKEN360_UPSTREAM: ${TOKEN360_UPSTREAM:-https://api.token360.ai}
      TOKEN360_CATALOG_URL: ${TOKEN360_CATALOG_URL:-https://api.token360.ai/public/models?size=200&current=1}
      RH_API_KEY: ${RH_API_KEY:-}
      RH_API_BASE_URL: ${RH_API_BASE_URL:-https://www.runninghub.cn/openapi/v2}
      RH_MODEL_REGISTRY_URL: ${RH_MODEL_REGISTRY_URL:-https://raw.githubusercontent.com/HM-RunningHub/ComfyUI_RH_OpenAPI/main/developer-kit/model-registry.public.json}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jingjie}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
