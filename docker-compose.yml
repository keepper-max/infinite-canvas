name: jingjie-studio

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://studio:studio@db:5432/jingjie}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-jingjie-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio123}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
      TOKEN360_API_KEY: ${TOKEN360_API_KEY:-}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-https://api.token360.ai/v1}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen3.8-flash}
      VERIFICATION_CODE_SECRET: ${VERIFICATION_CODE_SECRET:-}
      VERIFY_CODE_EXPIRE_SECONDS: ${VERIFY_CODE_EXPIRE_SECONDS:-300}
      VERIFY_CODE_RESEND_SECONDS: ${VERIFY_CODE_RESEND_SECONDS:-60}
      VERIFY_CODE_MAX_ATTEMPTS: ${VERIFY_CODE_MAX_ATTEMPTS:-5}
      VERIFY_CODE_ACCOUNT_HOURLY_LIMIT: ${VERIFY_CODE_ACCOUNT_HOURLY_LIMIT:-5}
      VERIFY_CODE_ACCOUNT_DAILY_LIMIT: ${VERIFY_CODE_ACCOUNT_DAILY_LIMIT:-10}
      VERIFY_CODE_IP_HOURLY_LIMIT: ${VERIFY_CODE_IP_HOURLY_LIMIT:-30}
      REGISTRATION_INVITE_REQUIRED: ${REGISTRATION_INVITE_REQUIRED:-false}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-守守画布}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: jingjie
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d jingjie"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
  worker:
    build: .
    command: sh -c "npm run db:init && npm run worker"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://studio:studio@db:5432/jingjie}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: production
      TOKEN360_API_KEY: ${TOKEN360_API_KEY:-}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-https://api.token360.ai/v1}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen3.8-flash}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
