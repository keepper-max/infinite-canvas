services:
  web:
    image: ${WEB_IMAGE:-keepper-max/infinite-canvas-web:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: infinite-canvas
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:-keepper-max/infinite-canvas-api:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      API_PORT: "3002"
      DATABASE_URL: postgresql://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jingjie}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?set OBJECT_STORAGE_PUBLIC_ENDPOINT}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-infinite-canvas-assets}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?set OBJECT_STORAGE_ACCESS_KEY_ID}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      OBJECT_STORAGE_AUTO_CREATE_BUCKET: ${OBJECT_STORAGE_AUTO_CREATE_BUCKET:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JOB_QUEUE_NAME: ${JOB_QUEUE_NAME:-generation-jobs}
      TRANSFER_QUEUE_NAME: ${TRANSFER_QUEUE_NAME:-generation-transfers}
      COMPOSITION_QUEUE_NAME: ${COMPOSITION_QUEUE_NAME:-composition-jobs}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      PROVIDER_SUBMIT_TIMEOUT_MS: ${PROVIDER_SUBMIT_TIMEOUT_MS:-0}
      VIDEO_POLL_INTERVAL_MS: ${VIDEO_POLL_INTERVAL_MS:-2000}
      JOB_MAX_RUNTIME_MS: ${JOB_MAX_RUNTIME_MS:-0}
      TOKEN360_API_KEY: ${TOKEN360_API_KEY:-}
      TOKEN360_UPSTREAM: ${TOKEN360_UPSTREAM:-https://api.token360.ai}
      TOKEN360_CATALOG_URL: ${TOKEN360_CATALOG_URL:-https://api.token360.ai/public/models?size=200&current=1}
      RH_API_KEY: ${RH_API_KEY:-}
      RH_API_BASE_URL: ${RH_API_BASE_URL:-https://www.runninghub.cn/openapi/v2}
      RH_MODEL_REGISTRY_URL: ${RH_MODEL_REGISTRY_URL:-https://raw.githubusercontent.com/HM-RunningHub/ComfyUI_RH_OpenAPI/main/developer-kit/model-registry.public.json}
      RH_GLOBAL_API_KEY: ${RH_GLOBAL_API_KEY:-}
      RH_GLOBAL_API_BASE_URL: ${RH_GLOBAL_API_BASE_URL:-https://www.runninghub.ai/openapi/v2}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 15

  worker:
    image: ${API_IMAGE:-keepper-max/infinite-canvas-api:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jingjie}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?set OBJECT_STORAGE_PUBLIC_ENDPOINT}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-infinite-canvas-assets}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?set OBJECT_STORAGE_ACCESS_KEY_ID}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      OBJECT_STORAGE_AUTO_CREATE_BUCKET: ${OBJECT_STORAGE_AUTO_CREATE_BUCKET:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JOB_QUEUE_NAME: ${JOB_QUEUE_NAME:-generation-jobs}
      TRANSFER_QUEUE_NAME: ${TRANSFER_QUEUE_NAME:-generation-transfers}
      TRANSFER_WORKER_CONCURRENCY: ${TRANSFER_WORKER_CONCURRENCY:-4}
      COMPOSITION_QUEUE_NAME: ${COMPOSITION_QUEUE_NAME:-composition-jobs}
      COMPOSITION_WORKER_CONCURRENCY: ${COMPOSITION_WORKER_CONCURRENCY:-1}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      PROVIDER_SUBMIT_TIMEOUT_MS: ${PROVIDER_SUBMIT_TIMEOUT_MS:-0}
      VIDEO_POLL_INTERVAL_MS: ${VIDEO_POLL_INTERVAL_MS:-2000}
      JOB_MAX_RUNTIME_MS: ${JOB_MAX_RUNTIME_MS:-0}
      TOKEN360_API_KEY: ${TOKEN360_API_KEY:-}
      TOKEN360_UPSTREAM: ${TOKEN360_UPSTREAM:-https://api.token360.ai}
      TOKEN360_CATALOG_URL: ${TOKEN360_CATALOG_URL:-https://api.token360.ai/public/models?size=200&current=1}
      RH_API_KEY: ${RH_API_KEY:-}
      RH_API_BASE_URL: ${RH_API_BASE_URL:-https://www.runninghub.cn/openapi/v2}
      RH_MODEL_REGISTRY_URL: ${RH_MODEL_REGISTRY_URL:-https://raw.githubusercontent.com/HM-RunningHub/ComfyUI_RH_OpenAPI/main/developer-kit/model-registry.public.json}
      RH_GLOBAL_API_KEY: ${RH_GLOBAL_API_KEY:-}
      RH_GLOBAL_API_BASE_URL: ${RH_GLOBAL_API_BASE_URL:-https://www.runninghub.ai/openapi/v2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jingjie}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY_ID:?set OBJECT_STORAGE_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_SECRET_ACCESS_KEY}
    ports:
      - "${MINIO_API_BIND:-127.0.0.1}:9000:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data:
