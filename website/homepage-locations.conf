# Included only in the root domain HTTPS server. Existing workbench routes stay proxied.
location = / {
    root /var/www/shoumiren-site/releases/20261021-site07;
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
}
location = /website-assets/20261016-site01/fusion.css {
    alias /var/www/shoumiren-site/releases/20261016-site01/fusion.css;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /website-assets/20261016-site01/brand-logo.png {
    alias /var/www/shoumiren-site/releases/20261016-site01/brand-logo.png;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /website-assets/20261017-site02/content.css {
    alias /var/www/shoumiren-site/releases/20261017-site02/content.css;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /website-assets/20261017-site02/content.js {
    alias /var/www/shoumiren-site/releases/20261017-site02/content.js;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /website-assets/20261017-site02/cases/ {
    alias /var/www/shoumiren-site/releases/20261017-site02/assets/cases/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /website-assets/20261017-site02/content-news-20261018.js {
    alias /var/www/shoumiren-site/releases/20261017-site02/content-news-20261018.js;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /website-news/current.js {
    alias /var/www/shoumiren-site/releases/20261021-site07/news-current.js;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /lab/polytech-tree { return 302 /lab/polytech-tree/; }
location = /lab/polytech-tree/ {
    root /var/www/shoumiren-site/releases/20261021-site07;
    try_files /lab/polytech-tree/index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
location ^~ /lab/polytech-tree/assets/ {
    gzip on;
    gzip_types application/javascript text/css;
    gzip_vary on;
    alias /var/www/shoumiren-site/releases/20261021-site07/lab/polytech-tree/assets/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ~ ^/lab/polytech-tree/(LICENSE|LICENSE-data\.md|LICENSE-three\.txt|THIRD-PARTY-NOTICES\.txt|dataset-source\.json)$ {
    alias /var/www/shoumiren-site/releases/20261021-site07/lab/polytech-tree/$1;
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location /lab/polytech-tree/ { return 404; }
location = /website-assets/polytech-tree/cover-f67e358e16e5.webp {
    alias /var/www/shoumiren-site/releases/20261021-site07/assets/polytech-tree/cover-f67e358e16e5.webp;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location = /website-assets/polytech-tree/case.css {
    alias /var/www/shoumiren-site/releases/20261021-site07/assets/polytech-tree/case.css;
    add_header Cache-Control "no-cache" always;
}

# Private enterprise AI case library. Credentials are stored outside the repository.
location = /ai-cases { return 302 /ai-cases/$is_args$args; }
location ^~ /ai-cases/ {
    auth_basic "Private AI case library";
    auth_basic_user_file /etc/nginx/ai-cases-private/htpasswd;
    root /var/www/shoumiren-site/releases/20261021-site07;
    index index.html;
    try_files $uri $uri/ =404;
    error_page 404 /ai-cases/404.html;
    autoindex off;
    types { text/html html; text/css css; application/javascript mjs; application/json json; text/plain txt; }
    default_type application/octet-stream;
    gzip on;
    gzip_types application/javascript application/json text/css;
    gzip_vary on;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}

# Learning center: isolated static documents, never the canvas SPA fallback.
location = /learn { return 302 /learn/$is_args$args; }
location = /learn/explore { return 302 /learn/explore/$is_args$args; }
location = /learn/diagnose { return 302 /learn/diagnose/$is_args$args; }
location ^~ /learn/ {
    root /var/www/shoumiren-site/releases/20261021-site07;
    index index.html;
    try_files $uri $uri/ =404;
    autoindex off;
    types { text/html html; text/css css; application/javascript js; application/json json; image/png png; text/plain txt md; }
    default_type application/octet-stream;
    gzip on;
    gzip_types application/javascript application/json text/css;
    gzip_vary on;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
