document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.dataset.design){history.replaceState(null,'','?design='+el.dataset.design);selectDesign(el.dataset.design)}if(el.hasAttribute('data-home')){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})}if(el.hasAttribute('data-consult')){e.preventDefault();document.querySelector('#contact')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});document.querySelector('#inquiry-content')?.focus({preventScroll:true})}if(el.hasAttribute('data-case')){e.preventDefault();document.querySelector('#projects')?.scrollIntoView({behavior:'smooth'})}if(el.dataset.service!==undefined){e.preventDefault();openModal(serviceNames[Number(el.dataset.service)],'<p>从真实任务出发，先明确目标和使用边界，再讨论实施方式。</p><div class="modal-steps"><div>明确输入资料与目标输出</div><div>选定一个小范围试点</div><div>用实际任务验证，再决定是否扩展</div></div><p>可以从官网表单提交当前任务、已有资料和希望达到的结果。</p>')}if(el.dataset.article!==undefined){e.preventDefault();const article=websiteContent.articles[Number(el.dataset.article)];if(article)openModal(article.title,article.paragraphs.map(paragraph=>'<p>'+paragraph+'</p>').join(''))}if(el.dataset.problem!==undefined){const i=Number(el.dataset.problem);document.querySelectorAll('[data-problem]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));document.querySelector('#problem-result').textContent=['建议从「场景梳理」开始：明确任务、现有流程与限制，形成可以优先验证的应用清单。','建议从「流程设计」开始：整理工具之间的输入输出，识别重复操作，保留必要的人工确认。','建议从「原型验证」开始：选一个最小可用场景，先验证关键步骤，再讨论完整建设。'][i]}if(el.id==='next-step'){step=(step+1)%3;document.querySelectorAll('[data-node]').forEach(n=>n.classList.toggle('active',Number(n.dataset.node)===step));document.querySelector('#step-title').textContent=['01　从一个明确目标开始','02　把素材与步骤组织起来','03　逐步验证，保留修改空间'][step];document.querySelector('#step-copy').textContent=['先写下想让观众理解什么，再决定需要哪些素材和制作步骤。','将参考图、文字和制作要求对应到任务中，建立可以理解的关系。','检查每一步是否符合目标，保留素材与版本，再推进下一阶段。'][step];el.textContent=step===2?'重新体验 ↺':'查看下一步 →'}});
document.querySelector('.close').onclick=()=>document.querySelector('#modal').close();
selectDesign('fusion');document.title='守密人 · AI 应用咨询与产品实践';
</script>

<script>
// Motion is disposable: changing designs never leaves an animation loop behind.
let disposeMotion=()=>{};
function mountMotion(){
 disposeMotion();const root=document.querySelector('.fusion');if(!root)return;
 const stage=root.querySelector('.fusion-visual'),canvas=document.createElement('canvas');canvas.setAttribute('aria-hidden','true');stage.prepend(canvas);
 const tag=document.createElement('span');tag.className='field-tag';tag.textContent='HUMAN × INTELLIGENCE';stage.append(tag);
 const toggle=document.createElement('button');toggle.className='motion-toggle';toggle.type='button';toggle.setAttribute('aria-label','暂停或开启背景动效');stage.append(toggle);
 const progress=document.createElement('div');progress.className='reading-progress';progress.setAttribute('aria-hidden','true');root.append(progress);
 const media=matchMedia('(prefers-reduced-motion: reduce)'),ctx=canvas.getContext('2d');let paused=media.matches,visible=true,frame=0,last=0,time=0,w=1,h=1,px=0,py=0,targetX=0,targetY=0,dead=false;
 function setLabel(){toggle.textContent=paused?'开启动效 ↗':'暂停动效 Ⅱ';toggle.setAttribute('aria-pressed',String(!paused));root.classList.toggle('motion-paused',paused)}
 function draw(){if(!ctx)return;ctx.clearRect(0,0,w,h);const cx=w*.52+px*28,cy=h*.43+py*20,scale=Math.min(w*.39,h*.49);const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,scale*1.5);glow.addColorStop(0,'#44caff25');glow.addColorStop(1,'#ffffff00');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
 for(let ring=0;ring<32;ring++){const offset=ring/31;ctx.beginPath();for(let i=0;i<=160;i++){const angle=i/160*Math.PI*2,twist=time*.13+offset*2.6;const radius=scale*(.57+offset*.4+.08*Math.sin(angle*3+time*.4));const x=Math.cos(angle)*radius;const y=Math.sin(angle)*radius;const z=Math.sin(angle*2+twist)*scale*.33;const rx=x*Math.cos(twist*.2)+z*Math.sin(twist*.2);const ry=y*.72+z*.66;const X=cx+rx,Y=cy+ry; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.strokeStyle=`rgba(${Math.round(28+offset*40)},${Math.round(125+offset*55)},${Math.round(194+offset*40)},${.16+offset*.27})`;ctx.lineWidth=.85;ctx.stroke()}
 // Signals follow visible paths into the shared field, never float as isolated specks.
 for(let lane=0;lane<4;lane++){const side=lane%2?1:-1,startY=cy+scale*(lane<2?-.65:.65);const point=t=>({x:cx+side*scale*(1.14-.83*t),y:startY+(cy-startY)*t+Math.sin(t*Math.PI)*scale*(lane<2?.14:-.14)});ctx.beginPath();for(let j=0;j<=48;j++){const p=point(j/48);j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.strokeStyle='rgba(32,134,178,.15)';ctx.lineWidth=.8;ctx.stroke();const t=(time*.16+lane*.24)%1;ctx.beginPath();for(let j=0;j<=12;j++){const p=point(Math.max(0,t-.12)+Math.min(t,.12)*j/12);j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.strokeStyle=`rgba(23,128,174,${Math.sin(t*Math.PI)*.65})`;ctx.lineWidth=1.8;ctx.stroke()}}
 function tick(now){frame=0;if(dead||paused||!visible||document.hidden)return;if(now-last>32){time+=Math.min((now-last)/1000,.06);last=now;px+=(targetX-px)*.07;py+=(targetY-py)*.07;draw()}frame=requestAnimationFrame(tick)}
 function start(){if(ctx&&!frame&&!paused&&visible&&!document.hidden){last=performance.now();frame=requestAnimationFrame(tick)}}
 function stop(){cancelAnimationFrame(frame);frame=0}
 function resize(){const box=stage.getBoundingClientRect();w=box.width;h=box.height;const dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx?.setTransform(dpr,0,0,dpr,0,0);draw()}
 const ro=new ResizeObserver(resize);ro.observe(stage);
 const visibility=new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;visible?start():stop()});visibility.observe(stage);
 const enter=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('is-pending');enter.unobserve(e.target)}}),{threshold:.06});
 root.querySelectorAll('main>.section,.process>div,.fusion-articles>a').forEach((el,i)=>{el.classList.add('motion-enter');el.style.setProperty('--reveal-delay',`${i%3*70}ms`);if(!media.matches&&el.getBoundingClientRect().top>innerHeight){el.classList.add('is-pending');enter.observe(el)}});
 function pointer(e){const rect=stage.getBoundingClientRect();targetX=(e.clientX-rect.left)/rect.width-.5;targetY=(e.clientY-rect.top)/rect.height-.5}function leave(){targetX=targetY=0}
 function visibilityChange(){document.hidden?stop():start()}function scroll(){const max=document.documentElement.scrollHeight-innerHeight;progress.style.transform=`scaleX(${max>0?Math.max(0,Math.min(1,scrollY/max)):0})`}
 function preference(){paused=media.matches;setLabel();paused?stop():start();if(paused){root.querySelectorAll('.is-pending').forEach(el=>el.classList.remove('is-pending'));draw()}}
 toggle.onclick=()=>{paused=!paused;setLabel();paused?stop():start()};stage.addEventListener('pointermove',pointer,{passive:true});stage.addEventListener('pointerleave',leave);document.addEventListener('visibilitychange',visibilityChange);window.addEventListener('scroll',scroll,{passive:true});media.addEventListener('change',preference);setLabel();resize();scroll();start();
 disposeMotion=()=>{dead=true;stop();ro.disconnect();visibility.disconnect();enter.disconnect();stage.removeEventListener('pointermove',pointer);stage.removeEventListener('pointerleave',leave);document.removeEventListener('visibilitychange',visibilityChange);window.removeEventListener('scroll',scroll);media.removeEventListener('change',preference);canvas.remove();tag.remove();toggle.remove();progress.remove()};
}
document.addEventListener('click',e=>{if(e.target.closest('[data-design]'))mountMotion()});window.addEventListener('pagehide',()=>disposeMotion());window.addEventListener('pageshow',e=>{if(e.persisted)mountMotion()});mountMotion();
</script>

<style>
.contact{align-items:flex-start;flex-wrap:wrap}.contact>div{flex:1;min-width:min(100%,280px)}.contact a{text-decoration:underline;text-underline-offset:4px;overflow-wrap:anywhere}.inquiry-form{flex:1;min-width:min(100%,300px);max-width:620px;display:grid;gap:12px}.inquiry-form>label{font-weight:600}.inquiry-form textarea,.inquiry-form input:not([type=checkbox]){width:100%;padding:12px 14px;border:1px solid currentColor;border-radius:5px;background:transparent;color:inherit}.inquiry-form textarea{resize:vertical}.inquiry-form ::placeholder{color:inherit;opacity:.75}.inquiry-form :focus-visible{outline:2px solid currentColor;outline-offset:4px}.inquiry-form .inquiry-consent{display:flex;align-items:flex-start;gap:10px;font-size:12px;font-weight:400;line-height:1.7}.inquiry-consent input{margin-top:5px;flex-shrink:0}.inquiry-form button:disabled{opacity:.6;cursor:wait}.inquiry-form #inquiry-result{overflow-wrap:anywhere;font-size:13px;margin:0}.inquiry-form[aria-busy=true]{cursor:progress}
</style>
<script>
document.addEventListener('submit',async event=>{
 const form=event.target;if(form.id!=='inquiry-form')return;event.preventDefault();
 if(form.dataset.busy||!form.reportValidity())return;
 const content=form.elements.content.value.trim(),contact=form.elements.contact.value.trim(),result=form.querySelector('#inquiry-result');
 if(content.length<2||!contact){result.textContent='请填写具体需求和联系方式。';return}
 const signature=JSON.stringify([content,contact]);
 if(form.dataset.signature!==signature){form.dataset.signature=signature;form.dataset.requestId=crypto.randomUUID()}
 form.dataset.busy='1';form.setAttribute('aria-busy','true');const button=form.querySelector('button[type=submit]');button.disabled=true;button.textContent='正在提交…';result.textContent='';
 // Preserve all inputs on failure; do not store contact details in browser storage.
 for(const input of form.querySelectorAll('input,textarea'))input.disabled=true;
 try{
  const response=await fetch('/api/website/inquiries',{method:'POST',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:form.dataset.requestId,content,contact,consent:true})});
  const payload=await response.json().catch(()=>null);
  if(!response.ok||payload?.data?.id!==form.dataset.requestId)throw new Error(payload?.error?.message||'暂时无法提交，请稍后重试，或直接邮件联系。');
  result.textContent='需求已收到。我们会通过你留下的联系方式沟通。记录编号：'+payload.data.id;
  form.reset();delete form.dataset.signature;delete form.dataset.requestId;
 }catch(error){result.textContent=error instanceof Error?error.message:'提交失败，内容已保留，请重试或直接邮件联系。'}
 finally{delete form.dataset.busy;form.removeAttribute('aria-busy');button.disabled=false;button.textContent='提交需求 ↗';for(const input of form.querySelectorAll('input,textarea'))input.disabled=false}
});
</script>
