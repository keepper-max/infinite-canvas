# Include these locations before the generic /api/ location in the HTTPS server.
location = /_media_authorize {
    internal;
    proxy_pass http://127.0.0.1:19002$request_uri;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Media-Authorize-Only "1";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /api/media/asset-versions/ {
    auth_request /_media_authorize;

    proxy_pass http://127.0.0.1:19102;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_buffering on;
    slice 2m;
    proxy_set_header Range $slice_range;
    proxy_set_header If-Range "";
    proxy_cache shoumiren_media;
    proxy_cache_key "$uri|$arg_thumbnail|$slice_range";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 206 30d;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
