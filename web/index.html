<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="守守画布 AI 创作工具" />
        <link rel="icon" type="image/png" href="/shoushou-logo.png" />
        <title>守守画布</title>
        <link rel="preload" as="image" href="/shoushou-logo.png" />
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="startup-prelude" aria-hidden="true" style="position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: #080808; contain: strict">
            <div
                id="startup-prelude-grid"
                style="
                    position: absolute;
                    inset: -35% -20%;
                    background-image: linear-gradient(#c9c4b624 1px, transparent 1px), linear-gradient(90deg, #c9c4b624 1px, transparent 1px);
                    background-size: 66px 66px;
                    transform: perspective(660px) rotateX(66deg) scale(1.45) translateY(6%);
                    transform-origin: center 70%;
                    opacity: 0.28;
                "
            ></div>
        </div>
        <div id="root"></div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
